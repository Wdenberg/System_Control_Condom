spring:
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: garage-scheduler-

  application:
    name: garage-control-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/garage_control}
    username: ${SPRING_DATASOURCE_USERNAME:garage}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    problemdetails:
      enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:0.0.0.0}

  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

      group:
        readiness:
          include:
            - readinessState
            - db
            - redis

        liveness:
          include:
            - livenessState

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        garage_hikvision_processing_seconds: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:garage-control-backend}
      secret-base64: ${JWT_SECRET_BASE64:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}
    hardening:
      cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}
      trust-forwarded-headers: ${SECURITY_TRUST_FORWARDED_HEADERS:false}
      hsts-enabled: ${SECURITY_HSTS_ENABLED:false}
      rate-limit-enabled: ${SECURITY_RATE_LIMIT_ENABLED:true}
      login-requests-per-minute: ${SECURITY_LOGIN_REQUESTS_PER_MINUTE:10}
      hikvision-requests-per-minute: ${SECURITY_HIKVISION_REQUESTS_PER_MINUTE:120}
      rate-limit-fail-open: ${SECURITY_RATE_LIMIT_FAIL_OPEN:false}
  hikvision:
    entry-host: ${HIKVISION_ENTRY_HOST:192.168.15.43}
    exit-host: ${HIKVISION_EXIT_HOST:192.168.15.44}
    port: ${HIKVISION_PORT:80}
    username: ${HIKVISION_USERNAME:}
    password: ${HIKVISION_PASSWORD:}
    webhook-token: ${HIKVISION_WEBHOOK_TOKEN:} # legacy: never used for authentication
    webhook:
      tokens:
        CAM-ENTRADA: ${HIKVISION_ENTRY_WEBHOOK_TOKEN:}
        CAM-SAIDA: ${HIKVISION_EXIT_WEBHOOK_TOKEN:}
    cooldown: ${HIKVISION_COOLDOWN:PT30S}
    image-storage-path: ${HIKVISION_IMAGE_STORAGE_PATH:./data/hikvision}
    enforce-remote-ip: ${HIKVISION_ENFORCE_REMOTE_IP:true}
  parking:
    access:
      min-confidence: ${PARKING_ACCESS_MIN_CONFIDENCE:80}
  dashboard:
    zone-id: ${DASHBOARD_ZONE_ID:America/Recife}
    cache-ttl: ${DASHBOARD_CACHE_TTL:PT5S}
  realtime:
    heartbeat-interval-ms: ${REALTIME_HEARTBEAT_INTERVAL_MS:15000}
  gate:
    enabled: ${GATE_ENABLED:false}
    driver: ${GATE_DRIVER:SIMULATED}
    entry-url: ${GATE_ENTRY_URL:}
    exit-url: ${GATE_EXIT_URL:}
    username: ${GATE_USERNAME:}
    password: ${GATE_PASSWORD:}
    bearer-token: ${GATE_BEARER_TOKEN:}
    timeout: ${GATE_TIMEOUT:PT3S}
    max-attempts: ${GATE_MAX_ATTEMPTS:3}
    retry-delay: ${GATE_RETRY_DELAY:PT5S}
    operation-poll-delay-ms: ${GATE_OPERATION_POLL_DELAY_MS:2000}
    include-plate-in-command: ${GATE_INCLUDE_PLATE:false}
    open-pulse-millis: ${GATE_OPEN_PULSE_MILLIS:1000}
  initial-admin:
    enabled: ${APP_INITIAL_ADMIN_ENABLED:false}
    username: ${APP_INITIAL_ADMIN_USERNAME:admin}
    password: ${APP_INITIAL_ADMIN_PASSWORD:}
    full-name: ${APP_INITIAL_ADMIN_FULL_NAME:Administrador}
    role: ${APP_INITIAL_ADMIN_ROLE:SUPER_ADMIN}

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}
        name: garage-control-backend
        version: ${APP_VERSION:0.0.7-SNAPSHOT}
  level:
    root: INFO
    com.estacionamento.api: INFO
