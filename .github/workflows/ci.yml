name: Garage validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Exact provider version matches Vitest. Incorporate it in the lockfile once registry access is available.
      - run: npm install --no-save --package-lock=false @vitest/coverage-v8@5.0.0
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew clean test build --no-daemon
        working-directory: backend
      - run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet
      - run: bash deploy/scripts/validate-release.sh
      - run: bash -n deploy/scripts/*.sh e2e/scripts/run-e2e.sh
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: bash e2e/scripts/run-e2e.sh
